<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Story Auto</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div class="app-shell">
    <aside class="app-nav" aria-label="Application">
      <div class="brand" aria-label="Story Auto">
        <span class="brand-mark" aria-hidden="true">SA</span>
        <span><strong>Story Auto</strong><small>Video production</small></span>
      </div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item is-active" id="homeNav" type="button" aria-current="page"><span aria-hidden="true">⌂</span> Home</button>
        <button class="nav-item" id="settingsNav" type="button"><span aria-hidden="true">⚙</span> Settings</button>
      </nav>
      <div class="nav-foot"><span class="health-dot" aria-hidden="true"></span><span>Local workspace</span><small id="runtimeState">Ready</small></div>
    </aside>
    <main id="mainContent" tabindex="-1">
      <header class="app-bar">
        <div>
          <p class="eyebrow" id="viewEyebrow">YOUR VIDEOS</p>
          <h1 id="viewTitle">Home</h1>
        </div>
        <div class="app-bar-actions" id="appBarActions"></div>
      </header>
      <section class="view" id="view" aria-live="polite" aria-busy="false"></section>
    </main>
  </div>

  <dialog id="newVideoDialog" aria-labelledby="wizardTitle">
    <div class="dialog-shell">
      <header class="dialog-head">
        <div><p class="eyebrow">NEW VIDEO</p><h2 id="wizardTitle">Add your content</h2></div>
        <button class="icon-button" id="closeWizard" type="button" aria-label="Close new video">×</button>
      </header>
      <ol class="stepper" id="wizardSteps" aria-label="New video progress"></ol>
      <div class="error-summary" id="wizardError" role="alert" hidden></div>
      <div class="dialog-content" id="wizardContent"></div>
      <footer class="dialog-actions" id="wizardActions"></footer>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="/static/app.js"></script>
</body>
</html>
